name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test & assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accept licences)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Lint, unit tests & debug APK
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtsPath-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
